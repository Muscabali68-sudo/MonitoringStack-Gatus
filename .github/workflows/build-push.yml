name: Build and Push

on:
  workflow_dispatch: 

jobs:
  build-push:
    name: Build and push Gatus image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-central-1
      ECR_REPOSITORY: gatus_repo
      IMAGE_TAG: ${{ github.sha }} 

    steps:
      - name: Check out validated code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_TAG }}
          persist-credentials: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::244306245751:role/gatus_build_pushRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gatus_build_pushRole

      - name: Log in to Amazon ECR 
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build Gatus image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/arm64 --tag "$IMAGE_URI" ./gatus

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push Gatus image to ECR
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$IMAGE_URI"